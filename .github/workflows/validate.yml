name: Validate application
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile application
        run: python -m py_compile app.py
      - name: Validate JSON catalogs
        run: |
          python -m json.tool device_models.json >/dev/null
          python -m json.tool archive_profiles.json >/dev/null
